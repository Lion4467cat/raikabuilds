    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #f6f5f1;
            --surface: #ffffff;
            --text: #141518;
            --text-2: #575b63;
            --border: #dfded8;
            --accent: #1d3b72;
            --accent-soft: rgba(29, 59, 114, 0.09);
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        }

        html, body {
            min-height: 100%;
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            -webkit-font-smoothing: antialiased;
        }

        .toolbar {
            position: sticky;
            top: 0;
            z-index: 20;
            background-color: rgba(246, 245, 241, 0.94);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
        }

        .toolbar-inner {
            max-width: 868px;
            margin: 0 auto;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .toolbar-title {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            color: var(--text-2);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .toolbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 32px;
            padding: 0 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background-color: var(--surface);
            color: var(--text);
            font-family: var(--font-sans);
            font-size: 0.8rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
        }

        .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-primary {
            background-color: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
        }

        .btn-primary:hover {
            opacity: 0.92;
            color: #ffffff;
        }

        .sheet-wrap {
            padding: 24px 16px 40px;
            display: flex;
            justify-content: center;
        }

        .cv-page {
            width: 100%;
            max-width: 820px;
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(20, 21, 24, 0.08);
            overflow: hidden;
        }

        .cv-page svg {
            display: block;
            width: 100%;
            height: auto;
        }

        .cv-links a rect {
            fill: transparent;
            stroke: transparent;
            pointer-events: all;
            transition: fill 0.15s ease, stroke 0.15s ease;
        }

        .cv-links a:hover rect,
        .cv-links a:focus-visible rect {
            fill: var(--accent-soft);
            stroke: rgba(29, 59, 114, 0.35);
            stroke-width: 0.6;
        }

        @media (max-width: 640px) {
            .toolbar-inner { padding: 10px 14px; }
            .toolbar-title { display: none; }
            .sheet-wrap { padding: 12px 8px 28px; }
        }

        @page {
            size: A4;
            margin: 0;
        }

        @media print {
            html, body {
                background: #ffffff;
            }
            .toolbar {
                display: none !important;
            }
            .sheet-wrap {
                padding: 0;
            }
            .cv-page {
                max-width: none;
                width: 100%;
                border: 0;
                border-radius: 0;
                box-shadow: none;
            }
        }
    </style>
